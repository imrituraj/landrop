name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Two browser contexts on one runner with real WebRTC. Not a LAN test.
      - run: pnpm test:e2e
        env:
          E2E_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: landrop:ci
      - name: Smoke test the image
        run: |
          docker run -d --name landrop -p 8787:8787 landrop:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/readyz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/ | grep -q '<div id="root">'
          docker stop -t 10 landrop
          docker logs landrop | grep -q shutdown_complete
